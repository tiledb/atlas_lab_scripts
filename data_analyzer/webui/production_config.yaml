long_burnin_voltage_betas:
- value: 2.0
  description: "Multi-layer ceramic capacitors (MLCCs)\nInsulation resistance degradation,
    dielectric breakdown, and oxygen vacancy migration (β = 1.5->3.0)."
- value: 4.0
  description: "Aluminum electrolytic capacitors\nElectrolyte vaporization and internal
    pressure buildup leading to seal rupture (β = 3.0->5.0)."
- value: 3.5
  description: "Solid tantalum capacitors\nSelf-healing failure breakdown and localized
    manganese dioxide (MnO₂) reduction (β = 3.0->4.0)."
- value: 6.0
  description: "Thin-film transistors & optoelectronics\nHot carrier injection (HCI)
    and gate-oxide breakdown in older or wider semiconductor nodes (β = 5.0->7.0)."
- value: 10.0
  description: "Ultra-thin gate dielectrics (modern ICs)\nTime-dependent dielectric
    breakdown (TDDB) in advanced microscopic silicon structures, where voltage stress
    is highly non-linear (β = 10.0+)."
