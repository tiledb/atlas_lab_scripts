long_burnin_peck_exponents:
- value: 2.0
  description: "Hermetically sealed & ruggedized modules\nPackage delamination or
    moisture ingress along the lead-frame interfaces of robust industrial packages
    (n = 2.0->2.5)."
- value: 2.66
  description: "Aluminum metallization / bare die\nPeck's baseline for temperature-humidity
    accelerated testing of aluminum corrosion and galvanic corrosion of bare internal
    wiring (n = 2.66)."
- value: 3.0
  description: "Consumer plastics & liquid crystal displays\nGeneral standard for
    electronics epoxy packaging; commonly 0.7 eV for LCDs (n = 3.0)."
- value: 4.5
  description: "Military & aerospace hardware (MIL-HDBK-217F)\nStrict baseline for
    temperature and humidity stress factors on electronic components; captures aggressive
    multi-layer circuit board insulation degradation (n = 4.5)."
